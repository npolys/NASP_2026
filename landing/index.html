<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forestry Data</title>
    <link rel="icon" href="./NASP_Argonne/favicon.ico" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #fff;
        color: #111;
      }
      header {
        background: #000;
        color: #fff;
        padding: 1.25rem 1.5rem;
        font-size: 1.4rem;
        font-weight: bold;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.5rem 1rem;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 1rem 0 0;
      }
      li + li {
        border-top: 1px solid #ddd;
      }
      a {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 0.25rem;
        color: inherit;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: #f2f2f2;
      }
      .name {
        font-weight: 600;
      }
      .plots {
        color: #555;
      }
    </style>
  </head>
  <body>
    <header>USFS Forestry Data</header>
    <main>
      <p>360° plot photospheres for the NASP forest management exercises.</p>
      <ul>
        <li>
          <a href="./NASP_Argonne/"
            ><span class="name">Argonne</span><span class="plots">Plots 1–4</span></a
          >
        </li>
        <li>
          <a href="./NASP_Fishburn/"
            ><span class="name">Fishburn</span><span class="plots">Plots 1–10</span></a
          >
        </li>
        <li>
          <a href="./NASP_Jefferson/"
            ><span class="name">Jefferson</span><span class="plots">Plots 1–8</span></a
          >
        </li>
        <li>
          <a href="./NASP_Penobscot/"
            ><span class="name">Penobscot</span
            ><span class="plots">Plots 11, 13, 15, 41, 43</span></a
          >
        </li>
        <li>
          <a href="./NASP_Reynolds/"
            ><span class="name">Reynolds</span><span class="plots">Plots 1–4</span></a
          >
        </li>
        <li>
          <a href="./NASP_Robinson/"
            ><span class="name">Robinson</span><span class="plots">Plots 1–8</span></a
          >
        </li>
      </ul>
    </main>
  </body>
</html>
